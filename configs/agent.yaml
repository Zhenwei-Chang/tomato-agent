version: v1.4.3
active_profile: improved

provider:
  name: mock
  model: mock-v11-improved
  temperature: 0

online_provider:
  name: openai
  api: responses
  model_env: OPENAI_MODEL
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  temperature: null
  timeout_seconds: 45
  max_retries: 2
  max_output_tokens: 4096
  store: false

deepseek_provider:
  name: deepseek
  api: responses
  api_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  model_env: DEEPSEEK_MODEL
  credential_file_env: DEEPSEEK_ENV_FILE
  # Public default is deliberately empty. Set DEEPSEEK_ENV_FILE explicitly to
  # read a credential file outside the repository.
  credential_file: null
  default_base_url: https://api.deepseek.com
  default_model: deepseek-flash
  reasoning_effort: none
  temperature: null
  timeout_seconds: 45
  max_retries: 2
  max_output_tokens: 4096
  store: false

agent:
  max_tool_calls: 5
  max_provider_calls: 6
  max_argument_repairs: 2
  max_tool_plan_repairs: 1
  minimum_retrieval_score: 3.0
  top_k_evidence: 6

profiles:
  baseline:
    router_prompt: router_v1.txt
    relevance_prompt: relevance_v1.txt
    synthesis_prompt: synthesis_v1.txt
    mock_version: baseline
  improved:
    router_prompt: router_v2.txt
    relevance_prompt: relevance_v2.txt
    synthesis_prompt: synthesis_v2.txt
    mock_version: improved
  repair_prompt: repair_v1.txt
  tool_plan_repair_prompt: tool_plan_repair_v142.txt
